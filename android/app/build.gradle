plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.sauvank.comicstream"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = "27.0.12077973"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "com.sauvank.comicstream"
        minSdk = 21
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            def keyAliasVal = System.getenv("KEY_ALIAS") ?: (keystorePropertiesFile.exists() ? keystoreProperties['keyAlias'] : null)
            def keyPassVal = System.getenv("KEY_PASSWORD") ?: (keystorePropertiesFile.exists() ? keystoreProperties['keyPassword'] : null)
            def storePassVal = System.getenv("KEYSTORE_PASSWORD") ?: (keystorePropertiesFile.exists() ? keystoreProperties['storePassword'] : null)
            
            keyAlias keyAliasVal ?: 'comicstream-upload-key'
            keyPassword keyPassVal ?: 'REMOVED'
            storePassword storePassVal ?: 'REMOVED'
            storeFile file('upload-keystore.jks')
            storeType 'PKCS12'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }
}

flutter {
    source = "../.."
}
