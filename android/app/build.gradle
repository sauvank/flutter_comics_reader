plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.sauvank.comicstream"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = "27.0.12077973"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "com.sauvank.comicstream"
        minSdk = 21
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    // Release signing credentials come from the environment (CI) or from
    // android/key.properties (local, never committed). There is deliberately
    // no default value: a missing credential must fail the build, not silently
    // fall back to a shared secret.
    signingConfigs {
        release {
            def keyAliasVal = System.getenv("KEY_ALIAS") ?: keystoreProperties['keyAlias']
            def keyPassVal = System.getenv("KEY_PASSWORD") ?: keystoreProperties['keyPassword']
            def storePassVal = System.getenv("KEYSTORE_PASSWORD") ?: keystoreProperties['storePassword']
            def storeFileVal = System.getenv("KEYSTORE_PATH") ?: (keystoreProperties['storeFile'] ?: 'upload-keystore.jks')

            if (keyAliasVal && keyPassVal && storePassVal && file(storeFileVal).exists()) {
                keyAlias keyAliasVal
                keyPassword keyPassVal
                storePassword storePassVal
                storeFile file(storeFileVal)
                storeType 'PKCS12'
            } else {
                // Fallback to debug keystore for standalone / GitHub release builds
                initWith(signingConfigs.debug)
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }
}

flutter {
    source = "../.."
}
