name: Build & Release (Android & Windows)

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag de la version (ex: v1.0.1)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  # -------------------------------------------------------------
  # 1. BUILD ANDROID APKs
  # -------------------------------------------------------------
  build-apk:
    name: 📱 Build Android APK
    runs-on: ubuntu-latest
    # Les secrets de signature sont volontairement limités à cet environnement.
    environment: production
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 🐦 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - name: 📦 Install dependencies
        run: flutter pub get

      # Configuration Firebase restaurée uniquement dans le runner CI.
      - name: 🔥 Restore Firebase Android configuration
        env:
          FIREBASE_ANDROID_CONFIG: ${{ secrets.FIREBASE_ANDROID_CONFIG }}
        run: |
          if [ -z "$FIREBASE_ANDROID_CONFIG" ]; then
            echo "::error::Secret FIREBASE_ANDROID_CONFIG absent."
            exit 1
          fi
          printf '%s' "$FIREBASE_ANDROID_CONFIG" > android/app/google-services.json

      - name: 🔍 Analyze code
        run: flutter analyze || true

      # Les APK GitHub doivent être signés par la même clé stable que l'AAB
      # envoyé à Play : une clé de debug recréée à chaque job casse OAuth.
      - name: 🔐 Restore upload signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 absent."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks

      - name: ✅ Verify upload signing credentials
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          for name in KEYSTORE_PASSWORD KEY_PASSWORD KEY_ALIAS; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name absent."
              exit 1
            fi
          done
          keytool -list -keystore android/app/upload-keystore.jks \
            -storepass "$KEYSTORE_PASSWORD" -storetype PKCS12 \
            -alias "$KEY_ALIAS" > /dev/null

      - name: 🏷️ Extract App Version
        id: app_version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1 | tr -d '[:space:]')
          echo "version=v${VERSION}" >> $GITHUB_OUTPUT
          echo "Building version v${VERSION}"

      - name: 🔨 Build Universal APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          flutter build apk --release

      - name: 🔨 Build Split APKs (Optimized size for ARM64/ARMv7)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          flutter build apk --release --split-per-abi

      - name: 📋 Prepare Android Artifacts
        run: |
          VERSION="${{ steps.app_version.outputs.version }}"
          mkdir -p release_android
          # Universal APK with version in name
          cp build/app/outputs/flutter-apk/app-release.apk "release_android/ComicStream-${VERSION}-Universal.apk"
          # Split APKs with version in name
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "release_android/ComicStream-${VERSION}-arm64-v8a.apk" || true
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "release_android/ComicStream-${VERSION}-armeabi-v7a.apk" || true
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk "release_android/ComicStream-${VERSION}-x86_64.apk" || true

      - name: 📤 Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: release_android/
          retention-days: 1

      - name: 🧹 Cleanup signing material
        if: always()
        run: rm -f android/app/upload-keystore.jks android/app/google-services.json

  # -------------------------------------------------------------
  # 2. BUILD WINDOWS RELEASE (.EXE / ZIP)
  # -------------------------------------------------------------
  build-windows:
    name: 🪟 Build Windows Release
    runs-on: windows-2022
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🛠️ Set up Visual Studio C++ Environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: 🐦 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - name: ⚙️ Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: 📦 Install dependencies
        run: flutter pub get

      - name: 🏷️ Extract App Version
        id: app_version
        shell: pwsh
        run: |
          $versionLine = Get-Content pubspec.yaml | Select-String "^version:"
          $ver = ($versionLine -split ":")[1].Trim().Split("+")[0].Trim()
          echo "version=v$ver" >> $env:GITHUB_OUTPUT
          Write-Host "Building Windows version v$ver"

      - name: 🔨 Build Windows App
        run: flutter build windows --release

      - name: 📦 Compress Windows Release (Portable ZIP)
        shell: pwsh
        run: |
          $ver = "${{ steps.app_version.outputs.version }}"
          New-Item -ItemType Directory -Force -Path release_windows
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath "release_windows\ComicStream-$ver-Windows-x64.zip"

      - name: 🛠️ Build Windows Installer (.exe Setup)
        shell: pwsh
        run: |
          $ver = "${{ steps.app_version.outputs.version }}"
          choco install innosetup -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" windows\installer\installer.iss
          if (Test-Path "windows\installer\Output\ComicStream-Setup-x64.exe") {
            Copy-Item "windows\installer\Output\ComicStream-Setup-x64.exe" "release_windows\ComicStream-$ver-Setup-x64.exe"
          }

      - name: 📦 Build Windows MSI Package (.msi)
        shell: pwsh
        run: |
          $ver = "${{ steps.app_version.outputs.version }}"
          heat dir build\windows\x64\runner\Release -cg AppFiles -gg -scom -sreg -sfrag -srd -dr INSTALLFOLDER -var var.SourceDir -out windows\installer\AppFiles.wxs
          candle -arch x64 -dSourceDir="build\windows\x64\runner\Release" -ext WixUIExtension windows\installer\Product.wxs windows\installer\AppFiles.wxs -out windows\installer\
          light -ext WixUIExtension -sval windows\installer\Product.wixobj windows\installer\AppFiles.wixobj -out "release_windows\ComicStream-$ver-x64.msi" || true

      - name: 📤 Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release_windows/
          retention-days: 1

  # -------------------------------------------------------------
  # 3. PUBLISH GITHUB RELEASE
  # -------------------------------------------------------------
  publish-release:
    name: 🚀 Publish GitHub Release
    needs: [build-apk, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 📥 Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-android
          path: release_assets/

      - name: 📥 Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-windows
          path: release_assets/

      - name: 🏷️ Determine Release Tag
        id: release_info
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1 | tr -d '[:space:]')
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -n "${{ github.event.inputs.release_tag }}" ]; then
            echo "tag=${{ github.event.inputs.release_tag }}" >> $GITHUB_OUTPUT
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME=${GITHUB_REF#refs/tags/}
            echo "tag=${TAG_NAME}" >> $GITHUB_OUTPUT
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          else
            echo "tag=v${VERSION}" >> $GITHUB_OUTPUT
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: 🚀 Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: "ComicStream ${{ steps.release_info.outputs.tag }}"
          draft: false
          prerelease: ${{ steps.release_info.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
          files: release_assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
