name: Deploy to Google Play (Internal Test)

on:
  push:
    tags:
      - 'v*' # Se déclenche quand vous poussez un tag de version (ex: git tag v1.0.2 && git push --tags)
  workflow_dispatch: # Permet aussi de déclencher manuellement un déploiement en 1 clic sur GitHub

jobs:
  deploy:
    name: Build & Release to Google Play
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Code Analysis
        run: dart analyze lib/

      - name: Setup Signing Config
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'REMOVED' }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || 'REMOVED' }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'comicstream-upload-key' }}
        run: |
          cat <<EOF > android/key.properties
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
          keytool -list -keystore android/app/upload-keystore.jks -storepass "$KEYSTORE_PASSWORD"

      - name: Build Android App Bundle (AAB)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: flutter build appbundle --release --android-skip-build-dependency-validation

      - name: Prepare Google Play Credentials
        env:
          PLAY_STORE_JSON: ${{ secrets.PLAY_STORE_JSON_KEY || secrets.PLAY_STORE_JSON || secrets.PLAY_STORE_KEY || secrets.SERVICE_ACCOUNT_JSON }}
        run: |
          echo "Taille de la cle JSON Google Play : ${#PLAY_STORE_JSON} caractères"
          if [ -z "$PLAY_STORE_JSON" ] || [ "${#PLAY_STORE_JSON}" -lt 50 ]; then
            echo "::error::Le secret PLAY_STORE_JSON_KEY est VIDE ou INTROUVABLE dans GitHub Repository Secrets !"
            exit 1
          fi
          echo "$PLAY_STORE_JSON" > service_account.json

      - name: Deploy to Google Play Internal Track
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: service_account.json
          packageName: com.sauvank.comicstream
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
