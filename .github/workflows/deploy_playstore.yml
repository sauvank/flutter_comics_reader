name: Deploy to Google Play (Internal Test)

on:
  push:
    tags:
      - 'v*' # Se déclenche quand vous poussez un tag de version (ex: git tag v1.0.2 && git push --tags)
  workflow_dispatch: # Permet aussi de déclencher manuellement un déploiement en 1 clic sur GitHub

jobs:
  deploy:
    name: Build & Release to Google Play
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Code Analysis
        run: dart analyze lib/

      # Le keystore n'est PAS dans le dépôt. Il est restauré ici depuis un secret.
      # Pour créer le secret : base64 -w 0 upload-keystore.jks
      - name: Restore Upload Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 absent. Créez-le avec : base64 -w 0 upload-keystore.jks"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          size=$(stat -c%s android/app/upload-keystore.jks)
          echo "Keystore restauré : ${size} octets"
          if [ "$size" -lt 1000 ]; then
            echo "::error::Keystore décodé invalide (${size} octets) : le secret est probablement tronqué."
            exit 1
          fi

      - name: Verify Signing Credentials
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          for name in KEYSTORE_PASSWORD KEY_ALIAS; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name absent."
              exit 1
            fi
          done
          keytool -list -keystore android/app/upload-keystore.jks \
            -storepass "$KEYSTORE_PASSWORD" -storetype PKCS12 \
            -alias "$KEY_ALIAS" > /dev/null
          echo "Keystore et alias validés."

      - name: Build Android App Bundle (AAB)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: flutter build appbundle --release --android-skip-build-dependency-validation

      - name: Prepare Google Play Credentials
        env:
          PLAY_STORE_JSON: ${{ secrets.PLAY_STORE_JSON_KEY || secrets.PLAY_STORE_JSON || secrets.PLAY_STORE_KEY || secrets.SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_STORE_JSON" ] || [ "${#PLAY_STORE_JSON}" -lt 50 ]; then
            echo "::error::Le secret PLAY_STORE_JSON_KEY est VIDE ou INTROUVABLE dans GitHub Repository Secrets !"
            exit 1
          fi
          printf '%s' "$PLAY_STORE_JSON" > service_account.json

      - name: Deploy to Google Play Internal Track
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: service_account.json
          packageName: com.sauvank.comicstream
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

      - name: Cleanup Credentials
        if: always()
        run: rm -f service_account.json android/app/upload-keystore.jks android/key.properties
