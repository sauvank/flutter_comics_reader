name: Deploy to Google Play (Internal Test)

on:
  push:
    tags:
      - 'v*' # Se déclenche quand vous poussez un tag de version (ex: git tag v1.0.2 && git push --tags)
  workflow_dispatch: # Permet aussi de déclencher manuellement un déploiement en 1 clic sur GitHub

jobs:
  deploy:
    name: Build & Release to Google Play
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Code Analysis
        run: dart analyze lib/

      - name: Reconstruct Keystore & Signing Config
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
          cat <<EOC > android/key.properties
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOC

      - name: Build Android App Bundle (AAB)
        run: flutter build appbundle --release --android-skip-build-dependency-validation

      - name: Deploy to Google Play Internal Track
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: com.sauvank.comicstream
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
