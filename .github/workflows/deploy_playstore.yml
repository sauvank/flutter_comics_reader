name: Deploy to Google Play (Internal Test)

on:
  push:
    tags:
      - 'v*' # Se déclenche quand vous poussez un tag de version (ex: git tag v1.0.2 && git push --tags)
  workflow_dispatch: # Permet aussi de déclencher manuellement un déploiement en 1 clic sur GitHub

jobs:
  deploy:
    name: Build & Release to Google Play
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Code Analysis
        run: dart analyze lib/

      - name: Reconstruct Keystore & Signing Config
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 || secrets.ANDROID_KEYSTORE || secrets.KEYSTORE || secrets.KEYSTORE_BASE_64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD || 'REMOVED' }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.KEY_PASSWORD || 'REMOVED' }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || secrets.KEY_ALIAS || 'comicstream-upload-key' }}
        run: |
          python3 -c "
          import os, base64, sys
          b64 = os.environ.get('KEYSTORE_BASE64', '').strip()
          print(f'Caractères Base64 reçus : {len(b64)}')
          if not b64:
              print('ERREUR: Le secret ANDROID_KEYSTORE_BASE64 est vide dans GitHub Actions!')
              sys.exit(1)
          raw = base64.b64decode(b64)
          print(f'Octets décodés avec succès : {len(raw)} bytes')
          with open('android/app/upload-keystore.jks', 'wb') as f:
              f.write(raw)
          "
          cat <<EOF > android/key.properties
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
          keytool -list -keystore android/app/upload-keystore.jks -storepass "$KEYSTORE_PASSWORD"

      - name: Build Android App Bundle (AAB)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: flutter build appbundle --release --android-skip-build-dependency-validation

      - name: Deploy to Google Play Internal Track
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: com.sauvank.comicstream
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
